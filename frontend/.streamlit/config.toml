[server]
port = 8000

[theme]
# --- Thème sobre et professionnel : fond clair, accent bleu unique ---
base = "light"
font = "sans serif"

# Accent unique, utilisé avec parcimonie (boutons, curseurs, liens actifs).
primaryColor = "#2563EB"

# Surfaces neutres : fond blanc, blocs/latérale en gris très clair.
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"

# Texte ardoise foncé pour un bon contraste sans dureté.
textColor = "#1E293B"
