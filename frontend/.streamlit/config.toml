[server]
port = 8000

# --- Thème éditorial : fond crème, barre latérale vert forêt, accent vert ---
# Titres en serif (Lora), interface en sans-serif (Inter) — polices chargées
# via CSS dans utils/ui.py (injecter_styles).
[theme]
base = "light"
primaryColor = "#2E7257"
backgroundColor = "#F4F3EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2A26"
linkColor = "#2E7257"
font = "Inter, sans-serif"
headingFont = "Lora, Georgia, serif"
baseRadius = "0.7rem"
borderColor = "#E7E6DD"

# Barre latérale sombre (vert forêt), texte clair, accent menthe.
[theme.sidebar]
backgroundColor = "#143529"
secondaryBackgroundColor = "#1C4435"
textColor = "#D7E3DB"
primaryColor = "#8FE3B8"
borderColor = "#1C4435"
